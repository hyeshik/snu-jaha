name: Build Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and audit OTF package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge make python3-venv unzip curl ca-certificates

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve and check package version
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' scripts/build_jaha.py)"
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          echo "PACKAGE_ZIP=dist/SNUJaha-${version}.zip" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: make PYTHON=.venv/bin/python test

      - name: Build and audit distribution
        run: make -j2 PYTHON=.venv/bin/python distribution

      - name: Verify distribution layout
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'SNUJaha-*.otf' | wc -l)" -eq 14
          test -f "$PACKAGE_ZIP"
          test "$(unzip -Z1 "$PACKAGE_ZIP" | grep -Ec '^[^/]+$')" -eq 17
          test -z "$(unzip -Z1 "$PACKAGE_ZIP" | grep -Ev '^(SNUJaha-[A-Za-z]+\.otf|LICENSE(-(RIDIBatang|RobotoSerif))?\.txt)$')"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNUJaha-${{ github.sha }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: SNUJaha-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/SNUJaha-*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTE.md \
            --verify-tag
